<style>/* Layout: 公開用の一冊。中央の一列に索引（検索・カテゴリ・タグ）とメモを綴じる */
:root {
  --paper: #F2F4F8; --sheet: #FFFFFF; --ink: #18203A; --muted: #586278; --faint: #7D879B; --rule: #D8DDE7;
  --dot: rgba(36, 67, 201, .11); --accent: #2443C9; --on-accent: #FFFFFF; --accent-soft: #E6EBFB;
  --marker: #FCE68C; --marker-ink: #4B3C00; --done: #2B7449; --done-soft: #E1F1E7;
  --shadow: 0 1px 2px rgba(24, 32, 58, .05), 0 6px 20px rgba(24, 32, 58, .06);
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #10141D; --sheet: #171C27; --ink: #E5E9F2; --muted: #A3ACBF; --faint: #7A8499; --rule: #2A3243;
    --dot: rgba(142, 162, 255, .08); --accent: #8EA2FF; --on-accent: #0E1430; --accent-soft: #1F2849;
    --marker: #4D4215; --marker-ink: #FBE38A; --done: #6CCB93; --done-soft: #16301F; --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper); background-image: radial-gradient(var(--dot) 1px, transparent 1.4px); background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 800px; margin-inline: auto; padding-inline: 16px; padding-block: 48px 72px; }
.masthead { display: grid; gap: 6px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.masthead h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 34px); line-height: 1.3; letter-spacing: .02em; text-wrap: balance; }
.masthead p { margin: 0; color: var(--muted); font-size: 15px; }
.stats { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--faint); }
.tools { display: grid; gap: 12px; margin-bottom: 20px; }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 999px; padding: 10px 16px 10px 40px;
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.facet { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.facet-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--faint); margin-right: 4px; }
.chip {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 999px; padding: 2px 12px; cursor: pointer; line-height: 1.8;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.result { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
.list { display: grid; gap: 12px; }
.memo { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px 14px; box-shadow: var(--shadow); min-width: 0; scroll-margin-top: 16px; }
.memo:target { outline: 2px solid var(--accent); outline-offset: 2px; }
.memo-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 12px; }
.memo h2 { margin: 0; flex: 1 1 14em; min-width: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.55; overflow-wrap: anywhere; text-wrap: pretty; }
.memo h2 a { color: inherit; text-decoration: none; }
.memo h2 a:hover { text-decoration: underline; }
.memo.is-done h2 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.kind { flex: none; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 1px 8px; border-radius: 4px; margin-top: 4px; margin-left: auto; white-space: nowrap; }
.kind-idea { color: var(--marker-ink); background: linear-gradient(transparent 38%, var(--marker) 38%); padding-inline: 4px; border-radius: 0; }
.kind-todo { color: var(--accent); border: 1px solid var(--accent); }
.kind-done { color: var(--done); border: 1px solid var(--done); background: var(--done-soft); }
.memo-body { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.memo-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule); font-size: 12px; color: var(--muted); }
.meta-cat { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 0 10px; color: var(--ink); }
.meta-tag { border: 1px solid var(--rule); border-radius: 999px; padding: 0 10px; }
.memo-meta time { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--faint); white-space: nowrap; }
.empty { text-align: center; padding: 40px 20px; border: 1px dashed var(--faint); border-radius: 10px; color: var(--muted); background: var(--sheet); }
.foot { margin-top: 40px; color: var(--faint); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
<h1>備忘録ノート</h1>
<p>アイデアとTODOを書き留めている備忘録です。</p>
<p class="stats">公開メモ 0 件 · 最終更新 <time datetime="2026-10-14T00:00:00.000Z">2026/10/14</time></p>
</header>
<div class="tools" id="tools" hidden>
<div class="search" role="search"><label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">メモを検索</label><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5" stroke-linecap="round"></path></svg><input id="q" type="search" placeholder="キーワードで検索" autocomplete="off"></div>
</div>
<main>
<p class="result" id="result" aria-live="polite">全 0 件</p>
<div class="list" id="list">

</div>
<div class="empty" id="empty" >まだ公開しているメモはありません。</div>
</main>
<footer class="foot">© 備忘録ノート</footer>
</div>
<script>(function () {
  'use strict';
  var q = document.getElementById('q');
  var list = document.getElementById('list');
  if (!q || !list) return;
  var arts = Array.prototype.slice.call(list.querySelectorAll('.memo'));
  var norm = function (s) { return String(s || '').normalize('NFKC').toLowerCase(); };
  var texts = arts.map(function (a) { return norm(a.textContent); });
  var tagsOf = arts.map(function (a) { try { return JSON.parse(a.getAttribute('data-tags') || '[]'); } catch (e) { return []; } });
  var result = document.getElementById('result');
  var empty = document.getElementById('empty');
  var cat = null;
  var tag = null;

  function apply() {
    var ts = norm(q.value).split(/\s+/).filter(Boolean);
    var shown = 0;
    arts.forEach(function (a, i) {
      var ok = (!cat || a.getAttribute('data-cat') === cat) &&
        (!tag || tagsOf[i].indexOf(tag) >= 0) &&
        ts.every(function (t) { return texts[i].indexOf(t) >= 0; });
      a.hidden = !ok;
      if (ok) shown++;
    });
    var filtered = ts.length || cat || tag;
    if (result) result.textContent = filtered ? (arts.length + ' 件中 ' + shown + ' 件を表示') : ('全 ' + arts.length + ' 件');
    if (empty) empty.hidden = shown !== 0 || arts.length === 0;
    document.querySelectorAll('[data-filter-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-filter-cat') === cat)); });
    document.querySelectorAll('[data-filter-tag]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-filter-tag') === tag)); });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-filter-cat], [data-filter-tag]');
    if (!b) return;
    if (b.hasAttribute('data-filter-cat')) { var c = b.getAttribute('data-filter-cat'); cat = cat === c ? null : c; }
    if (b.hasAttribute('data-filter-tag')) { var t = b.getAttribute('data-filter-tag'); tag = tag === t ? null : t; }
    apply();
  });
  q.addEventListener('input', apply);
  document.addEventListener('keydown', function (e) {
    var typing = e.target.closest && e.target.closest('input, textarea, select');
    if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); }
  });
  document.getElementById('tools').hidden = false;
  apply();
})();
</script>
</body>
</html>
